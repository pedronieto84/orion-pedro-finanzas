<div class="flex h-screen">
  <!-- Sidebar -->
  <aside
    [class.w-64]="sidebarOpen()"
    [class.w-16]="!sidebarOpen()"
    class="bg-[#1e293b] flex flex-col fixed h-full z-10 transition-all duration-300"
  >
    <!-- Toggle button (outside sidebar edge) -->
    <button
      (click)="sidebarOpen.set(!sidebarOpen())"
      class="absolute -right-3 top-5 w-7 h-7 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs shadow-lg hover:bg-blue-400 transition-colors z-50 border-2 border-[#1e293b]"
      [title]="sidebarOpen() ? 'Colapsar' : 'Expandir'"
    >
      {{ sidebarOpen() ? '◀' : '▶' }}
    </button>

    <!-- Logo area -->
    <div class="border-b border-slate-700 p-4 flex items-center justify-center min-h-[60px] relative">
      <div class="flex items-center gap-2" [class.flex-col]="!sidebarOpen()">
        <span class="text-blue-400 text-xl">✦</span>
        <span [class.hidden]="!sidebarOpen()" class="text-xl font-bold tracking-wide text-white">Orion</span>
      </div>
      <span
        [class.hidden]="!sidebarOpen()"
        class="absolute bottom-1 right-4 text-[10px] text-slate-500"
      >
        v{{ appVersion }}
      </span>
    </div>

    <!-- Dimensions nav -->
    <nav class="flex-1 overflow-y-auto overflow-x-visible p-2 space-y-1">
      <p
        [class.hidden]="!sidebarOpen()"
        class="text-xs uppercase text-slate-500 mb-2 px-2 tracking-wider"
      >
        Dimensiones
      </p>
      @for (dim of dimensions(); track dim.id) {
        <a
          [routerLink]="['/dimension', dim.id]"
          routerLinkActive="bg-slate-700/50 text-white"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-700/30 hover:text-white transition-colors"
          [class.justify-center]="!sidebarOpen()"
          [title]="!sidebarOpen() ? dim.name : ''"
        >
          <span
            class="text-lg flex-shrink-0"
            [style.filter]="'drop-shadow(0 0 4px ' + dim.color + ')'"
          >
            {{ dim.icon }}
          </span>
          <span
            [class.hidden]="!sidebarOpen()"
            class="truncate text-sm"
          >
            {{ dim.name }}
          </span>
        </a>
      }
      <a
        routerLink="/dashboard"
        class="flex items-center gap-3 px-3 py-2.5 mt-2 rounded-lg text-blue-400 hover:bg-slate-700/30 transition-colors text-sm"
        [class.justify-center]="!sidebarOpen()"
        [title]="!sidebarOpen() ? 'Nueva Dimensión' : ''"
      >
        <span class="flex-shrink-0">＋</span>
        <span [class.hidden]="!sidebarOpen()">Nueva Dimensión</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="p-2 border-t border-slate-700">
      <a
        routerLink="/settings"
        routerLinkActive="text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/30 hover:text-white transition-colors text-sm"
        [class.justify-center]="!sidebarOpen()"
        [title]="!sidebarOpen() ? 'Configuración' : ''"
      >
        <span class="flex-shrink-0">⚙️</span>
        <span [class.hidden]="!sidebarOpen()">Configuración</span>
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main
    [class.ml-64]="sidebarOpen()"
    [class.ml-16]="!sidebarOpen()"
    class="flex-1 overflow-y-auto bg-[#0f172a] min-h-screen transition-all duration-300"
  >
    <router-outlet />
  </main>
</div>
