<div class="flex h-screen">
  <!-- Sidebar -->
  <aside [class.w-64]="sidebarOpen()" [class.w-16]="!sidebarOpen()" class="bg-[#1e293b] flex flex-col fixed h-full z-10 transition-all duration-300">
    <!-- Toggle button -->
    <button (click)="sidebarOpen.set(!sidebarOpen())" class="absolute -right-3 top-6 w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs shadow-lg hover:bg-blue-400 transition-colors z-20">
      {{ sidebarOpen() ? '◀' : '▶' }}
    </button>

    <!-- Logo -->
    <div class="p-4 border-b border-slate-700 flex items-center justify-center" [class.px-6]="sidebarOpen()">
      <h1 class="font-bold tracking-wide" [class.text-2xl]="sidebarOpen()" [class.text-xl]="!sidebarOpen()">
        <span class="text-blue-400">✦</span>
        <span [class.hidden]="!sidebarOpen()"> Orion</span>
      </h1>
      <span [class.hidden]="!sidebarOpen()" class="text-xs text-slate-500 mt-1 block">v{{ appVersion }}</span>
    </div>

    <!-- Dimensions nav -->
    <nav class="flex-1 overflow-y-auto p-4 space-y-1">
      <p [class.hidden]="!sidebarOpen()" class="text-xs uppercase text-slate-500 mb-3 tracking-wider">Dimensiones</p>
      @for (dim of dimensions(); track dim.id) {
        <a
          [routerLink]="['/dimension', dim.id]"
          routerLinkActive="bg-slate-700/50 text-white"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700/30 hover:text-white transition-colors"
          [class.justify-center]="!sidebarOpen()"
        >
          <span class="text-lg" [style.filter]="'drop-shadow(0 0 4px ' + dim.color + ')'">{{ dim.icon }}</span>
          <span [class.hidden]="!sidebarOpen()" class="truncate text-sm">{{ dim.name }}</span>
        </a>
      }
      <a
        routerLink="/dashboard"
        class="flex items-center gap-3 px-3 py-2 mt-2 rounded-lg text-blue-400 hover:bg-slate-700/30 transition-colors text-sm"
        [class.justify-center]="!sidebarOpen()"
      >
        <span>＋</span>
        <span [class.hidden]="!sidebarOpen()">Nueva Dimensión</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="p-4 border-t border-slate-700">
      <a
        routerLink="/settings"
        routerLinkActive="text-white"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-700/30 hover:text-white transition-colors text-sm"
        [class.justify-center]="!sidebarOpen()"
      >
        <span>⚙️</span>
        <span [class.hidden]="!sidebarOpen()">Configuración</span>
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main [class.ml-64]="sidebarOpen()" [class.ml-16]="!sidebarOpen()" class="flex-1 overflow-y-auto bg-[#0f172a] min-h-screen transition-all duration-300">
    <router-outlet />
  </main>
</div>
