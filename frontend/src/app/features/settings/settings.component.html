<div class="p-8">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold">⚙️ Configuración</h1>
      <p class="text-slate-400 mt-1">Gestiona tus dimensiones</p>
    </div>
    <button
      (click)="openAdd()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm font-medium transition-colors"
    >
      ＋ Nueva Dimensión
    </button>
  </div>

  <!-- Dimensions List -->
  <div class="space-y-3">
    @for (dim of dimensions(); track dim.id) {
      <div class="bg-[#1e293b] rounded-xl p-4 flex items-center justify-between group">
        <div class="flex items-center gap-4">
          <span class="text-2xl">{{ dim.icon }}</span>
          <div>
            <p class="font-medium">{{ dim.name }}</p>
            <div class="flex items-center gap-2 mt-1">
              <div class="w-4 h-4 rounded-full" [style.background]="dim.color"></div>
              <span class="text-xs text-slate-500">{{ dim.color }}</span>
            </div>
          </div>
        </div>
        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button
            (click)="openEdit(dim)"
            class="px-3 py-1 text-xs bg-slate-600 hover:bg-slate-500 rounded-lg transition-colors"
          >
            Editar
          </button>
          <button
            (click)="deleteDimension(dim.id)"
            class="px-3 py-1 text-xs bg-red-600/20 text-red-400 hover:bg-red-600/40 rounded-lg transition-colors"
          >
            Eliminar
          </button>
        </div>
      </div>
    }

    @if (dimensions().length === 0) {
      <div class="text-center py-20">
        <p class="text-slate-400">No hay dimensiones configuradas</p>
      </div>
    }
  </div>
</div>

<!-- Form Modal -->
@if (showForm()) {
  <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50" (click)="closeForm()">
    <div class="bg-[#1e293b] rounded-xl p-6 w-full max-w-md" (click)="$event.stopPropagation()">
      <h2 class="text-xl font-bold mb-6">
        {{ editingDimension ? 'Editar' : 'Nueva' }} Dimensión
      </h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Nombre</label>
          <input
            [(ngModel)]="formData.name"
            type="text"
            placeholder="Ej: Personal, Empresa..."
            class="w-full px-3 py-2 bg-[#0f172a] border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-sm text-slate-400 mb-1">Icono (emoji)</label>
            <input
              [(ngModel)]="formData.icon"
              type="text"
              class="w-full px-3 py-2 bg-[#0f172a] border border-slate-600 rounded-lg text-white text-center text-2xl focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="flex-1">
            <label class="block text-sm text-slate-400 mb-1">Color</label>
            <input
              [(ngModel)]="formData.color"
              type="color"
              class="w-full h-10 bg-[#0f172a] border border-slate-600 rounded-lg cursor-pointer"
            />
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button
          (click)="closeForm()"
          class="px-4 py-2 text-slate-400 hover:text-white transition-colors"
        >
          Cancelar
        </button>
        <button
          (click)="save()"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors"
        >
          {{ editingDimension ? 'Guardar' : 'Crear' }}
        </button>
      </div>
    </div>
  </div>
}
